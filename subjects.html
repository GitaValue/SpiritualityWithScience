<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Subject | GATE Physics Quiz</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top, #0a0a1f, #050510);
      color: #e0e0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 30px 10px;
    }

    h1 {
      margin-top: 40px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      font-size: 2rem;
      text-align: center;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 40px;
      width: 100%;
      max-width: 900px;
    }

    .subject-card {
      background: linear-gradient(145deg, #1a1a3f, #0a0a2a);
      border: 1px solid #00ffff33;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 0 15px #00ffff33;
      transition: all 0.3s ease;
    }

    .subject-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #00ffff77;
      border-color: #00ffff;
      background: linear-gradient(145deg, #002244, #001122);
    }

    .subject-card h2 {
      font-size: 1.3rem;
      color: #00ffff;
      margin-bottom: 10px;
    }

    .subject-card p {
      font-size: 0.9rem;
      color: #bbb;
    }

    a.home-link {
      margin-top: 40px;
      text-decoration: none;
      color: #00ffff;
      border: 1px solid #00ffff;
      padding: 10px 20px;
      border-radius: 25px;
      transition: 0.3s;
    }

    a.home-link:hover {
      background: #00ffff;
      color: #000;
    }
  </style>
</head>
<body>
  <h1>🧠 Choose a Physics Subject</h1>

  <div class="subject-grid" id="subjectGrid"></div>

  <a href="index.html" class="home-link">🏠 Back to Home</a>

  <script>
    const subjects = [
      { name: "Classical Mechanics", desc: "Newtonian, Lagrangian, and Hamiltonian systems" },
      { name: "Electromagnetism", desc: "Electric, magnetic fields, and Maxwell’s equations" },
      { name: "Quantum Mechanics", desc: "Wave-particle duality and Schrödinger equation" },
      { name: "Thermodynamics", desc: "Laws of heat, entropy, and energy conversion" },
      { name: "Optics", desc: "Interference, diffraction, and polarization" },
      { name: "Nuclear Physics", desc: "Radioactivity, nuclear forces, and reactions" },
      { name: "Solid State Physics", desc: "Crystal structures, bands, and semiconductors" },
      { name: "Mathematical Physics", desc: "Vector calculus, tensors, and differential equations" },
      { name: "Electronics", desc: "Diodes, transistors, and amplifiers" },
      { name: "Modern Physics", desc: "Relativity and photoelectric effect" }
    ];

    const grid = document.getElementById("subjectGrid");

    subjects.forEach(sub => {
      const card = document.createElement("div");
      card.classList.add("subject-card");
      card.innerHTML = `<h2>${sub.name}</h2><p>${sub.desc}</p>`;
      card.onclick = () => {
        localStorage.setItem("currentSubject", sub.name);
        window.location.href = "quiz.html";
      };
      grid.appendChild(card);
    });
  </script>
</body>
</html>
