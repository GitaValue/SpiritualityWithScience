<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GATE Physics Quiz</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #000428, #004e92);
      color: #e0e0ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      text-align: center;
    }

    header {
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff, 0 0 30px #0077ff;
    }

    p.subtitle {
      font-size: 1.1rem;
      color: #ccc;
      margin-top: 10px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 50px;
      width: 90%;
      max-width: 350px;
    }

    .menu a {
      text-decoration: none;
      font-weight: 600;
      padding: 15px 25px;
      border-radius: 30px;
      color: #fff;
      border: 1px solid #00ffff44;
      background: rgba(0, 255, 255, 0.1);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px #00ffff33;
      transition: 0.3s;
    }

    .menu a:hover {
      background: #00ffff;
      color: #000;
      transform: scale(1.05);
      box-shadow: 0 0 30px #00ffffaa;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.9rem;
      color: #aaa;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #ffcc00;
      text-shadow: 0 0 15px #ffcc00aa;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      .menu a {
        padding: 12px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Φ</div>
    <h1>GATE Physics Quiz Portal</h1>
    <p class="subtitle">Master Physics • Test Your Concepts • Track Your Rank</p>
  </header>

  <div class="menu">
    <a href="subjects.html">🎯 Start Quiz</a>
    <a href="leaderboard.html">🏆 Leaderboard</a>
    <a href="about.html">ℹ️ About</a>
  </div>

  <footer>
    © 2025 GATE Physics Quiz | Developed with ⚛️ and 💡 by You
  </footer>
</body>
</html>
